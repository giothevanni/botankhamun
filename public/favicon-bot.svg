    <polygon points="38,27 64,19 64,64 38,64" fill="#6f4a36"/>
    <polygon points="38,27 64,19 64,23 38,31" fill="#a8825a"/>
    <rect x="46" y="38" width="9" height="26" fill="#2f1f19"/>
