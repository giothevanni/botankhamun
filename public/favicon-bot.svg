<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="64">
      <stop offset="0" stop-color="#3a7694"/>
      <stop offset="0.65" stop-color="#9cc3cf"/>
      <stop offset="1" stop-color="#f3dca8"/>
    </linearGradient>
    <radialGradient id="glow" cx="14" cy="14" r="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff8d6" stop-opacity="1"/>
      <stop offset="0.4" stop-color="#fff1b8" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#fff1b8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="shape" clipPathUnits="userSpaceOnUse"><rect x="0" y="0" width="64" height="64" rx="14" ry="14"/></clipPath>
  </defs>
  <g clip-path="url(#shape)">
